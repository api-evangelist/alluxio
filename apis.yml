apis:
- name: Alluxio S3 API
  description: >-
    S3-compatible REST API exposed by every Alluxio worker (HTTP port 29998, HTTPS 29996) that lets
    applications built for Amazon S3 read and write cached data without code changes. Path-style
    requests only; mount points are surfaced as S3 buckets. Endpoint is deployment-specific (runs on
    the customer's self-hosted Alluxio cluster), so no public production baseURL exists.
  humanURL: https://documentation.alluxio.io/ee-ai-en/data-access/s3-api.md
