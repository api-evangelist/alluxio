aid: alluxio
name: Alluxio
description: >-
  Alluxio is a data platform company providing a distributed caching and data-orchestration layer
  that sits between compute engines and persistent storage to accelerate I/O-intensive AI/ML and
  analytics workloads. Its high-throughput, low-latency cache serves data to PyTorch, TensorFlow,
  Spark, Ray and other frameworks across AWS, GCP, Azure and Oracle Cloud, mounting underlying
  object and file stores (S3, GCS, Azure Blob, HDFS, OSS, COS, TOS) and exposing them through an
  S3-compatible REST API, a FUSE-based POSIX API, and a Python FSSpec client. The Apache-2.0
  open-source project (github.com/Alluxio/alluxio) underpins the commercial Alluxio Enterprise AI
  product. Alluxio is a portfolio company of a16z.
